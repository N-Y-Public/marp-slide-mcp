services:
  app:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    image: marp-slide-mcp-dev:latest
    container_name: marp-slide-mcp-app
    restart: unless-stopped
    volumes:
      - .:/workspaces/marp-slide-mcp:cached
    working_dir: /workspaces/marp-slide-mcp
    user: node
    environment:
      - LANG=ja_JP.UTF-8
      - LC_ALL=ja_JP.UTF-8
      - CHROME_PATH=/usr/bin/chromium
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=false
      - PUPPETEER_ARGS=--no-sandbox --disable-setuid-sandbox
      - NODE_ENV=development
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PAT_MARP_SLIDE_MCP:-${GITHUB_PERSONAL_ACCESS_TOKEN:-}}
      - EXPECTED_GITHUB_LOGIN=${EXPECTED_GITHUB_LOGIN:-}
      - EXPECTED_GITHUB_ID=${EXPECTED_GITHUB_ID:-}
    env_file:
      - path: .env
        required: false
    init: true
    command: /bin/sh -c "while sleep 1000; do :; done"

  github-mcp:
    image: ghcr.io/github/github-mcp-server:latest
    env_file:
      - path: .env
        required: false
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PAT_MARP_SLIDE_MCP:-${GITHUB_PERSONAL_ACCESS_TOKEN:-}}

