/*
  1. 基本設定
  スライド全体に関わる共通の設定を記述します。
*/

/*
  @page ルールは、印刷時やPDF出力時のページサイズとマージンを定義します。
  （ページサイズは Marp の @size ディレクティブにより 4:3 または 16:9 が自動設定されます）
*/@page{
  /* 印刷時のページ余白を0にします */margin:0}

/*
  section タグは、Marpにおいて「スライド1枚」を表すコンテナです。
  ここに記述したスタイルが、スライドのデフォルトの見た目になります。
*/div#\:\$p>svg>foreignObject>section{
  /* スライドの幅・高さは Marp の @size（4:3: 960x720, 16:9: 1280x720）に従います */height:720px;
  /* paddingやborderをwidth/heightに含める設定です（レイアウト崩れを防ぎます） */box-sizing:border-box;
  /* フォント（書体）を指定します。CFFフォント由来のType3埋め込みを回避しTrueType（CIDFontType2）で埋め込まれる日本語・欧文フォントを優先します */font-family:'Meiryo','BIZ UDGothic','Yu Gothic','IPAPGothic','IPAGothic','DejaVu Sans',sans-serif!important;
  /* 基本の文字色を黒 (#000000) に設定します */color:#000000;
  /* 基本の文字サイズを 18ポイント に設定します */font-size:18pt;
  /* 行の高さを文字サイズの1.5倍に設定し、読みやすくします */line-height:1.5;
  /* マージン（外側の余白）をなくします */margin:0;
  /* 要素をブロック要素として表示します */display:block;
  /* 子要素を絶対配置(absolute)するための基準点とします */position:relative;

  /*
     本文開始位置の確保 (Reference: 230px)
     上部に大きな余白(230px)を設けることで、ヘッダーやタイトル領域と本文が重ならないようにします。
     !important は、他のスタイル設定よりも優先させるための記述です。
  */padding:230px 40px 50px 40px!important;

  /*
     背景色およびフッター帯の設定（Issue #18 Acrobat白飛び防止対応）
     全面 linear-gradient によるPDF PatternType 2（ShadingType 2）生成を廃止し、
     単色白背景と内側下部40pxの単色矩形（inset box-shadow）でフッター帯を描画します。
  */background:#ffffff!important;
  /* 背景色を明示的に白（#ffffff）に固定します */background-color:#ffffff!important;
  /* スライド下部40px（680px〜720px）にテーマカラーの単色フッター帯を描画します */box-shadow:inset 0 -40px 0 0 var(--primary-color)!important;
  /* カラースキームをライトモードに固定しダークモード反転を防止します */color-scheme:light!important;
  /* PDF出力・印刷時に背景色と文字色を正確に維持します（WebKit系） */-webkit-print-color-adjust:exact!important;
  /* PDF出力・印刷時に背景色と文字色を正確に維持します（標準仕様） */print-color-adjust:exact!important;
  /* 太字ウェイトを持たないTrueTypeフォント（IPAPGothic等）使用時にPDF Type3（反転FontBBox）合成が発生するのを防ぎます */font-synthesis:none!important}div#\:\$p>svg>foreignObject>section{--marpit-root-font-size:18pt}

/* スライド内すべての要素に対して合成太字・合成斜体によるPDF Type3フォント化を防止します */div#\:\$p>svg>foreignObject>section *,div#\:\$p>svg>foreignObject>section :after,div#\:\$p>svg>foreignObject>section :before{
  /* 合成太字・合成斜体を無効化しTrueType（CIDFontType2）アウトライン埋め込みを維持します */font-synthesis:none!important}

/*
   2. 見出しタグ自体の非表示

   このテーマでは、Markdownの見出し（# タイトル、## サブタイトルなど）を
   そのまま表示せず、「レイアウトの目印（アンカー）」として使用します。
   そのため、h1～h5タグ自体は見えないように隠します。

   実際の文字は、見出しタグの「次の要素」として記述された内容を表示させます。
*/div#\:\$p>svg>foreignObject>section :is(h1,marp-h1),div#\:\$p>svg>foreignObject>section :is(h2,marp-h2),div#\:\$p>svg>foreignObject>section :is(h3,marp-h3),div#\:\$p>svg>foreignObject>section :is(h4,marp-h4),div#\:\$p>svg>foreignObject>section :is(h5,marp-h5),div#\:\$p>svg>foreignObject>section :is(h6,marp-h6){
  /* 要素を見えなくしますが、DOM（文書構造）上には残します */visibility:hidden;
  /* 文書の通常の流れから外し、絶対配置にします */position:absolute;
  /* 幅を0にします */width:0;
  /* 高さを0にします */height:0;
  /* はみ出した部分を隠します */overflow:hidden;
  /* 余白を0にします */margin:0;
  /* 内側の余白を0にします */padding:0;
  /* 枠線をなしにします */border:none;
  /* マウスイベント（クリックなど）を無効にします */pointer-events:none}

/*
   3. タイトルページ (Page 1) のレイアウト

   ここでは `section[data-marpit-pagination="1"]` というセレクタを使っています。
   これは「ページ番号が1であるスライド」を意味します。

   なぜ `section:first-child`（最初の要素）を使わないかというと、
   MarpでSVG形式でエクスポートする際、各スライドが個別のコンテナに入ってしまい、
   「すべてのスライドが first-child（最初の要素）」と判定されてしまう問題があるためです。
   ページ番号属性を使うことで、確実に1ページ目だけを指定できます。
*/

/*
   タイトルページのコンテナ設定 (Flexbox化)
*/div#\:\$p>svg>foreignObject>section[data-marpit-pagination="1"]{

<h1 id="%E3%83%9A%E3%83%BC%E3%82%B8%E3%82%BF%E3%82%A4%E3%83%88%E3%83%AB-1">ページタイトル</h1>
<p>中見出し（セクションディバイダー）の目的と課題解決</p>
<h2 id="%E3%83%9A%E3%83%BC%E3%82%B8%E4%B8%BB%E5%BC%B5">ページ主張</h2>
<ul>
<li>長大なスライド資料における現在地の明確化と構成の可視化を実現
<ul>
<li>ページ数の多いプレゼンテーションでも聴衆の集中を維持し論理構造を明示</li>
</ul>
</li>
</ul>
<h3 id="%E4%B8%BB%E5%BC%B5%E8%A3%9C%E8%B6%B3%E3%82%BF%E3%82%A4%E3%83%88%E3%83%AB">主張補足タイトル</h3>
<p>背景と解決アプローチ</p>
<h4 id="%E6%9C%AC%E6%96%87-1">本文</h4>
<ul>
<li><strong>課題</strong>: 30ページを超える長大な資料では、現在のスライドが全体のどの章・文脈に位置するのか見失いやすい</li>
<li><strong>解決策</strong>: 章の区切りとなる4種類の中見出し（セクションディバイダー）スライドを標準テンプレートとして提供
<ul>
<li><code>title-only</code>: 章タイトルのみを大きく表示する標準的な区切り</li>
<li><code>title-and-pages</code>: 章タイトルと章内のページ一覧・アンカーリンクを表示</li>
<li><code>all-chapters</code>: 全章一覧の中でカレント章を太字強調、他章を薄色（dim）表示</li>
<li><code>all-chapters-and-pages</code>: 全章一覧とカレント章配下のページリンクを複合表示</li>
</ul>
</li>
</ul>
<h5 id="%E5%9B%B3%E8%A1%A8%E5%87%BA%E5%85%B8">図表出典</h5>
<p>図表出典：Issue #17 / PBI-020 要求仕様書</p>

  <span class="hljs-attr">allChapters</span>: z.<span class="hljs-title function_">array</span>(z.<span class="hljs-title function_">string</span>()).<span class="hljs-title function_">optional</span>().<span class="hljs-title function_">describe</span>(<span class="hljs-string">&quot;全章のタイトル一覧&quot;</span>),

});
</code></pre>

<h2 id="%E3%83%9A%E3%83%BC%E3%82%B8%E4%B8%BB%E5%BC%B5-4">ページ主張</h2>
<ul>
<li>目次スライドを章単位のハイレベルアジェンダに集約可能
<ul>
<li>通常スライドの細かなタイトルを自動除外し、中見出しタイトルのみを抽出して目次を構築</li>
</ul>
</li>
</ul>
<h3 id="%E4%B8%BB%E5%BC%B5%E8%A3%9C%E8%B6%B3%E3%82%BF%E3%82%A4%E3%83%88%E3%83%AB-4">主張補足タイトル</h3>

<li>中見出しスライドを除外し、各スライドの <code>h1</code> 見出し（タイトル）を抽出して目次を生成</li>
</ul>
</li>
<li><strong>章別目次モード (<code>&lt;!-- _class: toc toc-chapters-only --&gt;</code>)</strong>:
<ul>
<li><code>section-divider</code> クラスを持つ中見出しスライドの章タイトルとページ番号のみを抽出</li>
<li>長大なデッキでもアジェンダが1〜2ページに整然と収まり、エグゼクティブサマリーに最適</li>
</ul>
</li>
